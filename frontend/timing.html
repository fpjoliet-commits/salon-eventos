<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="robots" content="noindex">
<title>Timing · Joliet</title>
<link rel="icon" type="image/png" href="/img/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Timing vivo de la maître. Se abre desde WhatsApp o desde el QR de la hoja
     impresa, en un celular, de noche y con una mano: fondo oscuro, letra grande
     y un toque por acción. El mismo archivo sirve los dos modos: el servidor
     dice si el link es el de la maître (edita) o el del QR impreso (solo mira). -->
<style>
:root{--bg:#141210;--card:#1f1c18;--line:#2e2a24;--tx:#f3eee4;--mut:#8a8174;--gold:#d4ab52;--gold-d:#c4993e;--ok:#6fae7a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tx);display:flex;flex-direction:column}
header{position:relative;padding:18px 84px 12px 18px;border-bottom:1px solid var(--line)}
.logo{color:var(--gold);font-weight:700;font-size:15px;letter-spacing:.08em}
h1{font-size:24px;margin-top:4px;line-height:1.2}
.sub{color:var(--mut);font-size:16px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{margin-top:10px;display:inline-block;padding:5px 12px;border-radius:99px;font-size:15px;font-weight:700}
.chip.atraso{background:#3a2a12;color:var(--gold)}
.chip.lectura{background:#2c2822;color:var(--mut);font-weight:500}
.chip.pend{background:#3a1d1a;color:#e39a8c;font-weight:500}
.chip[hidden]{display:none}
.qrbtn{position:absolute;top:16px;right:14px;width:60px;height:60px;background:#fff;border:none;border-radius:10px;padding:5px}
.qrbtn canvas,.qrbtn img{width:100%!important;height:100%!important;display:block}
main{flex:1;overflow-y:auto;padding:10px 12px 110px}
.paso{display:flex;gap:12px;padding:14px 10px;border-radius:14px;margin-bottom:6px;align-items:flex-start}
.paso.hecho{opacity:.45}
.paso.ahora{background:var(--card);border:2px solid var(--gold);opacity:1}
.hora{min-width:68px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.hora s{display:block;font-size:15px;color:var(--mut);font-weight:400}
.ahora .hora{color:var(--gold)}
.cuerpo{flex:1;min-width:0}
.act{font-size:20px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.ya{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.06em;margin-bottom:3px}
.desc{color:var(--mut);font-size:16px;margin-top:3px}
.nota{margin-top:8px;background:#2a2418;border-left:3px solid var(--gold);padding:7px 10px;border-radius:6px;font-size:16px;display:flex;gap:8px}
.nota div{flex:1}
.nota small{color:var(--mut);display:block;font-size:13px}
.nota button{background:none;border:none;color:var(--mut);font-size:18px;padding:0 4px}
.acc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:#2c2822;color:var(--tx);border:none;border-radius:10px;padding:10px 14px;font:inherit;font-size:16px;font-weight:500}
.btn.dor{background:var(--gold-d);color:#1a150c;font-weight:700}
.tic{width:36px;height:36px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;color:var(--bg);font-size:20px;font-weight:700}
.hecho .tic{background:var(--ok);border-color:var(--ok)}
.leer .tic{pointer-events:none}
.velo{position:fixed;inset:0;background:#0009;display:none;z-index:4}.velo.on{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--gold-d);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility .25s}
.hoja.on{transform:none;visibility:visible}
.hoja h2{font-size:20px;margin-bottom:14px}
.hoja p{color:var(--mut);font-size:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid .btn{padding:16px 0;font-size:20px;font-weight:700}
textarea{width:100%;height:96px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:18px;margin-bottom:12px}
.fila{display:flex;gap:10px}.fila .btn{flex:1;padding:14px}
.mas{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3;width:62px;height:62px;border-radius:50%;border:none;background:var(--gold-d);color:#1a150c;font-size:34px;font-weight:700;box-shadow:0 4px 14px #0008}
.mas[hidden]{display:none}
.opciones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opciones .btn{padding:9px 12px;font-size:15px}
.opciones .btn.on{background:var(--gold-d);color:#1a150c;font-weight:700}
.campo{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:18px;margin-bottom:12px}
input[type=time].campo{font-size:26px;font-weight:700;text-align:center;color-scheme:dark}
.qrgrande{position:fixed;inset:0;z-index:6;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.qrgrande.on{display:flex}
.qrgrande h2{font-size:22px}
.qrgrande .caja{background:#fff;padding:16px;border-radius:16px}
.qrgrande .url{color:var(--mut);font-size:15px;word-break:break-all}
.aviso{margin:auto;padding:32px 24px;text-align:center;color:var(--mut);font-size:18px;line-height:1.5}
.aviso b{display:block;color:var(--tx);font-size:22px;margin-bottom:8px}
</style></head><body>
<header id="cab" hidden>
  <div class="logo">J · TIMING</div>
  <h1 id="titulo"></h1>
  <div class="sub" id="sub"></div>
  <div class="chips">
    <span class="chip atraso" id="atraso" hidden></span>
    <span class="chip lectura" id="lectura" hidden>Solo lectura</span>
    <span class="chip pend" id="pend" hidden>Sin conexión · reintentando</span>
  </div>
  <button class="qrbtn" onclick="verQR(true)" aria-label="Compartir"><div id="qrMini"></div></button>
</header>
<main id="lista"><div class="aviso">Cargando…</div></main>

<div class="velo" id="velo" onclick="cerrar()"></div>
<div class="hoja" id="hCorrer">
  <h2 id="hcT"></h2>
  <div class="grid">
    <button class="btn" onclick="correr(5)">+5</button><button class="btn" onclick="correr(10)">+10</button><button class="btn" onclick="correr(15)">+15</button>
    <button class="btn" onclick="correr(30)">+30</button><button class="btn" onclick="correr(-5)">−5</button><button class="btn" onclick="correr(-10)">−10</button>
  </div>
</div>
<div class="hoja" id="hNota">
  <h2 id="hnT"></h2>
  <textarea id="txt" placeholder="Escribí o dictá con el micrófono…" maxlength="500"></textarea>
  <div class="fila"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn dor" onclick="guardarNota()">Guardar</button></div>
</div>
<button class="mas" id="mas" hidden onclick="abrirAgregar()" aria-label="Agregar paso">+</button>
<div class="hoja" id="hAgregar">
  <input type="time" id="agHora" class="campo">
  <div class="opciones" id="agOpc"></div>
  <input type="text" id="agOtro" class="campo" placeholder="Otro…" maxlength="60" oninput="marcarOpcion(null)">
  <div class="fila"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn dor" onclick="guardarPaso()">Agregar</button></div>
</div>
<div class="qrgrande" id="qrG" onclick="verQR(false)">
  <h2 id="qrT"></h2>
  <div class="caja"><div id="qrBig"></div></div>
  <div class="url" id="qrUrl"></div>
  <button class="btn">Cerrar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SLUG = location.pathname.split('/').filter(Boolean).pop();
const API = '/api/t/' + encodeURIComponent(SLUG);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
let D = null, sel = null, ocupado = 0, qrHecho = '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Igual que en el CRM: de 00:00 a 07:59 es "la madrugada de la misma fiesta".
const min = h => { const [a, b] = String(h || '00:00').split(':').map(Number); const t = (a || 0) * 60 + (b || 0); return t < 480 ? t + 1440 : t; };

function ahoraEvento() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
  return t < 480 ? t + 1440 : t;
}
// El paso "de ahora" solo existe la noche del evento (o su madrugada).
function esLaNoche() {
  const [y, m, d] = String(D.evento.fecha).split('-').map(Number);
  if (!y) return false;
  const hoy = new Date(); if (hoy.getHours() < 8) hoy.setDate(hoy.getDate() - 1);
  return hoy.getFullYear() === y && hoy.getMonth() === m - 1 && hoy.getDate() === d;
}

async function cargar() {
  if (ocupado) return;
  try {
    const r = await fetch(API, { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) return aviso(r.status === 410 ? 'Este link ya venció' : 'Link no encontrado', j.error || '');
    const primera = !D;
    D = j; $('pend').hidden = true;
    render();
    if (primera) setTimeout(centrar, 60);
  } catch { if (D) $('pend').hidden = false; else aviso('Sin conexión', 'Revisá la señal y volvé a abrir el link.'); }
}

function aviso(t, s) {
  $('cab').hidden = true;
  $('lista').innerHTML = `<div class="aviso"><b>${esc(t)}</b>${esc(s)}</div>`;
}

function render() {
  const ed = D.modo === 'editar', e = D.evento;
  $('cab').hidden = false;
  document.body.classList.toggle('leer', !ed);
  $('titulo').textContent = e.tipo ? `${e.tipo} · ${e.nombre}` : e.nombre;
  const [y, m, d] = String(e.fecha).split('-').map(Number);
  const f = y ? `${DIAS[new Date(y, m - 1, d).getDay()]} ${d}/${m}` : '';
  $('sub').textContent = [f, e.invitados && `${e.invitados} invitados`, e.formato].filter(Boolean).join(' · ');
  $('qrT').textContent = $('titulo').textContent + (f ? ' · ' + f : '');
  document.title = 'Timing · ' + e.nombre;
  $('lectura').hidden = ed;
  $('mas').hidden = !ed;

  const P = D.pasos;
  let c = -1;
  if (esLaNoche()) { const a = ahoraEvento(); P.forEach((p, i) => { if (min(p.hora) <= a) c = i; }); }
  // Cuánto se corrió lo que viene: +15' atrasados, −10' adelantados.
  const prox = P.find(p => !p.hecho) || P[P.length - 1];
  const dif = prox && prox.horaOriginal ? min(prox.hora) - min(prox.horaOriginal) : 0;
  $('atraso').hidden = !dif;
  $('atraso').textContent = (dif > 0 ? '+' : '−') + Math.abs(dif) + "'";

  $('lista').innerHTML = P.length ? P.map((p, i) => `
    <div class="paso ${p.hecho ? 'hecho' : ''} ${i === c ? 'ahora' : ''}">
      <button class="tic" onclick="tildar(${i})" aria-label="Hecho">${p.hecho ? '✓' : ''}</button>
      <div class="hora">${p.horaOriginal && p.horaOriginal !== p.hora ? `<s>${esc(p.horaOriginal)}</s>` : ''}${esc(p.hora)}</div>
      <div class="cuerpo">
        ${i === c ? '<div class="ya">AHORA</div>' : ''}
        <div class="act">${esc(p.actividad)}</div>
        ${p.descripcion ? `<div class="desc">${esc(p.descripcion)}</div>` : ''}
        ${(p.notas || []).map((n, k) => `<div class="nota"><div><small>${esc(n.h)}</small>${esc(n.t)}</div>${ed ? `<button onclick="borrarNota(${i},${k})" aria-label="Borrar nota">✕</button>` : ''}</div>`).join('')}
        ${ed && !p.hecho ? `<div class="acc"><button class="btn" onclick="abrir('hCorrer',${i})">⏱ Correr</button><button class="btn" onclick="abrir('hNota',${i})">+ Nota</button>${p.propio ? `<button class="btn" onclick="borrarPaso(${i})" aria-label="Borrar paso">✕</button>` : ''}</div>` : ''}
      </div>
    </div>`).join('') : '<div class="aviso">Todavía no hay pasos cargados.</div>';

  const url = location.origin + D.compartir;
  if (qrHecho !== url && window.QRCode) {
    qrHecho = url;
    [['qrMini', 100], ['qrBig', 240]].forEach(([id, t]) => { $(id).innerHTML = ''; new QRCode($(id), { text: url, width: t, height: t, correctLevel: QRCode.CorrectLevel.M }); });
    $('qrUrl').textContent = url.replace(/^https?:\/\//, '');
  }
}

function centrar() {
  const e = document.querySelector('.ahora'), l = $('lista');
  if (e) l.scrollTop = e.offsetTop - l.offsetTop - l.clientHeight / 2 + e.offsetHeight / 2;
}

// Se ve el cambio al instante; si no llega al servidor, se reintenta.
async function enviar(cuerpo) {
  ocupado++;
  try {
    for (let intento = 0; ; intento++) {
      try {
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
        if (r.ok) { $('pend').hidden = true; break; }
        const j = await r.json().catch(() => ({})); alert(j.error || 'No se pudo guardar.'); break;
      } catch { $('pend').hidden = false; await new Promise(ok => setTimeout(ok, Math.min(30000, 3000 * (intento + 1)))); }
    }
  } finally { ocupado--; }
  cargar();
}

function tildar(i) {
  if (D.modo !== 'editar') return;
  const p = D.pasos[i]; p.hecho = !p.hecho; render();
  enviar({ accion: 'tildar', id: p.id, hecho: p.hecho });
}
function abrir(id, i) {
  sel = i; $('velo').classList.add('on'); $(id).classList.add('on');
  $('hcT').textContent = '⏱ ' + D.pasos[i].actividad;
  $('hnT').textContent = 'Nota · ' + D.pasos[i].actividad;
  if (id === 'hNota') { $('txt').value = ''; setTimeout(() => $('txt').focus(), 250); }
}
function cerrar() { document.querySelectorAll('.hoja,.velo').forEach(e => e.classList.remove('on')); }
function correr(n) {
  const p = D.pasos[sel], desde = min(p.hora); cerrar();
  D.pasos.forEach(q => {
    if (min(q.hora) < desde) return;
    if (!q.horaOriginal) q.horaOriginal = q.hora;
    const t = ((min(q.hora) + n) % 1440 + 1440) % 1440;
    q.hora = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  });
  render(); enviar({ accion: 'correr', id: p.id, minutos: n });
}
function guardarNota() {
  const t = $('txt').value.trim(), p = D.pasos[sel]; cerrar(); if (!t) return;
  const d = new Date();
  (p.notas = p.notas || []).push({ h: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), t });
  render(); enviar({ accion: 'nota', id: p.id, texto: t });
}
function borrarNota(i, k) {
  if (!confirm('¿Borrar esta nota?')) return;
  const p = D.pasos[i]; p.notas.splice(k, 1); render();
  enviar({ accion: 'borrarNota', id: p.id, indice: k });
}
/* Pasos que se suman en la noche. Salen de los atajos del Timing Planner. */
const OPCIONES_PASO = ['FOTOS DE MESA', 'TANDA', 'BRINDIS', 'VIDEO', 'SHOW', 'VELAS', 'PIÑATA', 'CINTITAS', 'COTILLÓN', 'FOTO FINAL'];
let opcionPaso = null;
function marcarOpcion(o) {
  opcionPaso = o;
  if (o) $('agOtro').value = '';
  $('agOpc').querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.dataset.o === o));
}
function abrirAgregar() {
  // La hora propuesta: 5 minutos antes del próximo paso que falta.
  const prox = D.pasos.find(p => !p.hecho);
  let t = prox ? min(prox.hora) - 5 : ahoraEvento();
  t = ((t % 1440) + 1440) % 1440;
  $('agHora').value = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  $('agOpc').innerHTML = OPCIONES_PASO.map(o => `<button class="btn" data-o="${o}" onclick="marcarOpcion(this.dataset.o)">${o.charAt(0) + o.slice(1).toLowerCase()}</button>`).join('');
  $('agOtro').value = ''; opcionPaso = null;
  $('velo').classList.add('on'); $('hAgregar').classList.add('on');
}
function guardarPaso() {
  const hora = $('agHora').value, actividad = (opcionPaso || $('agOtro').value).trim().toUpperCase();
  if (!hora || !actividad) return;
  cerrar();
  D.pasos.push({ id: 'nuevo', hora, actividad, descripcion: '', hecho: false, horaOriginal: '', notas: [], propio: true });
  D.pasos.sort((a, b) => min(a.hora) - min(b.hora));
  render(); enviar({ accion: 'agregar', hora, actividad });
}
function borrarPaso(i) {
  const p = D.pasos[i];
  if (!confirm(`¿Borrar ${p.actividad}?`)) return;
  D.pasos.splice(i, 1); render();
  enviar({ accion: 'borrar', id: p.id });
}

function verQR(v) { $('qrG').classList.toggle('on', v); }

// En vivo: el servidor avisa cuando algo cambia. Por las dudas (señal que se
// corta) también se refresca cada 30 s y al volver a la app.
cargar();
try { new EventSource(API + '/vivo').onmessage = () => cargar(); } catch {}
setInterval(() => { if (!document.hidden) cargar(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { cargar(); pedirPantalla(); } });
// Que la pantalla no se apague mientras la tiene abierta.
let wl = null;
async function pedirPantalla() { try { if (!wl && 'wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch {} }
pedirPantalla();
</script>
</body></html>
